spring.application.name=roboroutefms

# PostgreSQL Active Server Target Coordinates
spring.datasource.url=jdbc:postgresql://localhost:5432/fms_db
spring.datasource.username=fms_user
spring.datasource.password=fms_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Core MQTT Broker Target Routing Paths
fms.mqtt.broker-url=tcp://localhost:1883
fms.mqtt.client-id=fms-backend-core
